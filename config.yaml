# =========================================================
# AI Report Agent - Master Configuration
# Configure the data source, processing settings, report output,
# delivery options, and automation schedule.
# =========================================================


# ---------- DATA SOURCE ----------
# Available source types: csv, excel, sql, api, gsheet

data_source:
  source_type: "csv"          # Options: csv / excel / sql / api / gsheet

  csv:
    path: "sample_data/sample_sales.csv"

  excel:
    path: "sample_data/sample_sales.xlsx"
    sheet_name: 0              # Sheet index or sheet name

  sql:
    # SQLite is used for demonstration.
    # For production, provide a PostgreSQL or MySQL connection string.
    connection_string: "sqlite:///sample_data/sample_sales.db"
    query: "SELECT * FROM sales"

  api:
    url: "https://api.example.com/sales-data"
    method: "GET"
    headers:
      Authorization: "Bearer YOUR_API_TOKEN"
    params: {}
    # Specify the JSON path if the API response contains nested data.
    # Example: "data.records"
    json_path: null

  gsheet:
    sheet_id: "YOUR_GOOGLE_SHEET_ID"
    worksheet_name: "Sheet1"
    credentials_file: "config/gcreds.json"   # Google Service Account JSON file


# ---------- DATA CLEANING ----------
cleaning:
  drop_duplicates: true
  fill_missing_numeric_with: 0
  fill_missing_text_with: "Unknown"
  date_columns: ["date"]


# ---------- AI ANALYSIS ----------
ai_agent:
  enabled: true
  model: "claude-sonnet-4-6"

  # Specify the business context of the dataset to help
  # the AI agent generate more relevant insights.
  domain_hint: "sales and revenue data across regions and products"

  max_insights: 6


# ---------- REPORT OUTPUT ----------
report:
  # Available formats: pdf, excel, or both.
  formats: ["pdf", "excel"]

  title: "Automated Business Report"

  output_dir: "outputs"

  charts:
    - type: "bar"
      x: "region"
      y: "revenue"
      title: "Revenue by Region"

    - type: "line"
      x: "date"
      y: "revenue"
      title: "Revenue Trend Over Time"


# ---------- DELIVERY ----------
delivery:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your_email@gmail.com"
    sender_password: "YOUR_APP_PASSWORD"
    recipients: ["client@example.com"]
    subject: "Your Automated Report"


# ---------- SCHEDULE ----------
# Enable this section if automated report generation is required.

schedule:
  enabled: false
  frequency: "daily"     # Options: daily / weekly / monthly
  time: "09:00"
