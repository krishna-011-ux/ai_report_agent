# =========================================================
# AI Report Agent - Master Configuration
# Yahan aap batate ho: data kahan se aayega, aur report kaise/kahan jayegi
# =========================================================

# ---------- DATA SOURCE ----------
# source_type options: csv, excel, sql, api, gsheet
data_source:
  source_type: "csv"          # <-- yahan change karo: csv / excel / sql / api / gsheet

  csv:
    path: "sample_data/sample_sales.csv"

  excel:
    path: "sample_data/sample_sales.xlsx"
    sheet_name: 0              # sheet index ya naam

  sql:
    # SQLite demo ke liye; production mein postgres/mysql connection string do
    connection_string: "sqlite:///sample_data/sample_sales.db"
    query: "SELECT * FROM sales"

  api:
    url: "https://api.example.com/sales-data"
    method: "GET"
    headers:
      Authorization: "Bearer YOUR_API_TOKEN"
    params: {}
    json_path: null           # agar response nested hai, e.g. "data.records"

  gsheet:
    sheet_id: "YOUR_GOOGLE_SHEET_ID"
    worksheet_name: "Sheet1"
    credentials_file: "config/gcreds.json"   # Google service account JSON

# ---------- DATA CLEANING ----------
cleaning:
  drop_duplicates: true
  fill_missing_numeric_with: 0
  fill_missing_text_with: "Unknown"
  date_columns: ["date"]

# ---------- AI ANALYSIS ----------
ai_agent:
  enabled: true
  model: "claude-sonnet-4-6"
  # Kis business context mein data hai - agent isse insights better banayega
  domain_hint: "sales and revenue data across regions and products"
  max_insights: 6

# ---------- REPORT OUTPUT ----------
report:
  formats: ["pdf", "excel"]     # options: pdf, excel, both hi likh sakte ho list mein
  title: "Automated Business Report"
  output_dir: "outputs"
  charts:
    - type: "bar"
      x: "region"
      y: "revenue"
      title: "Revenue by Region"
    - type: "line"
      x: "date"
      y: "revenue"
      title: "Revenue Trend Over Time"

# ---------- DELIVERY ----------
delivery:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "your_email@gmail.com"
    sender_password: "YOUR_APP_PASSWORD"
    recipients: ["client@example.com"]
    subject: "Your Automated Report"

# ---------- SCHEDULE (agar automation chahiye) ----------
schedule:
  enabled: false
  frequency: "daily"     # daily / weekly / monthly
  time: "09:00"
